<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>摘星樓收支管理</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #f8f9fa;
            --accent-color: #2980b9;
            --danger-color: #e74c3c;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1.main-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 5px;
        }
        .title-divider {
            height: 4px;
            width: 80px;
            background-color: var(--secondary-color);
            border-radius: 2px;
            margin-bottom: 25px;
        }
        .banner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .balance-banner {
            background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.15);
        }
        .balance-banner.current {
            background: linear-gradient(135deg, #2b3e50 0%, #1a252f 100%);
            border-left: 5px solid var(--secondary-color);
        }
        .balance-label {
            font-size: 15px;
            font-weight: 500;
        }
        .balance-label span {
            background-color: var(--secondary-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 5px;
            font-size: 13px;
        }
        .balance-amount {
            font-size: 30px;
            font-weight: 700;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 700;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }
        input, select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-radius;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        input:disabled, select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #7f8c8d;
        }
        .btn-add {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 13px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
        }
        .btn-add:hover {
            background-color: #128f76;
        }
        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        .table-container {
            margin-top: 35px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 700;
        }
        tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="main-title">摘星樓收支管理</h1>
    <div class="title-divider"></div>

    <div class="banner-grid">
        <div class="balance-banner">
            <div class="balance-label"><span>結轉</span>前年度結餘金額</div>
            <div class="balance-amount">NT$ 120,662</div>
        </div>
        <div class="balance-banner current">
            <div class="balance-label"><span>即時</span>當前結餘金額</div>
            <div class="balance-amount" id="currentBalanceDisplay">NT$ 120,662</div>
        </div>
    </div>

    <!-- 記帳表單 -->
    <div class="form-grid">
        <div class="form-group">
            <label for="txDate">交易日期</label>
            <input type="date" id="txDate">
        </div>
        <div class="form-group">
            <label for="txType">收支類型</label>
            <select id="txType" onchange="updateCategories()">
                <option value="收入">收入</option>
                <option value="支出">支出</option>
            </select>
        </div>
        <div class="form-group">
            <label for="mainCategory">主要科目</label>
            <select id="mainCategory" onchange="handleLogicChange()">
                <!-- 由 JavaScript 動態生成 -->
            </select>
        </div>
        <div class="form-group" id="floorGroup">
            <label for="floor">對應樓層</label>
            <select id="floor">
                <option value="">-- 請選擇樓層 --</option>
                <option value="2F">2 樓</option>
                <option value="3F">3 樓</option>
                <option value="4F">4 樓</option>
                <option value="5F">5 樓</option>
                <option value="6F">6 樓</option>
                <option value="7F">7 樓</option>
            </select>
        </div>
        <div class="form-group" id="planGroup">
            <label for="paymentPlan">繳交期數方案</label>
            <select id="paymentPlan" onchange="handlePlanPrice()">
                <option value="" data-price="0">-- 請選擇方案 --</option>
                <option value="雙月繳" data-price="3000">雙月繳 ($3,000)</option>
                <option value="半年繳" data-price="9000">半年繳 ($9,000)</option>
                <option value="年繳" data-price="18000">年繳 ($18,000)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="amount">金額</label>
            <input type="number" id="amount" placeholder="請輸入金額" min="0" step="1">
        </div>
    </div>

    <button class="btn-add" onclick="addRecord()">➕ 新增收支紀錄</button>

    <div class="table-container">
        <h3 style="color: var(--primary-color);">📊 歷史收支明細</h3>
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>類型</th>
                    <th>科目</th>
                    <th>樓層</th>
                    <th>配置方案</th>
                    <th>金額</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordTableBody">
                <!-- 歷史紀錄渲染處 -->
            </tbody>
        </table>
    </div>
</div>

<script>
// 1. 固定常數與變額基礎
var INITIAL_BALANCE = 120662;
var currentBalance = INITIAL_BALANCE;
var records = []; 

var incomeCategories = ["管理費", "其他"];
var expenseCategories = ["電梯保養費", "清潔費", "公設電費", "電梯代辦檢驗及證照費", "消防申報費", "其他"];

// 2. 初始化今日日期 (Windows 電腦標準規格)
function initSystemDate() {
    var d = new Date();
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    document.getElementById('txDate').value = yyyy + '-' + mm + '-' + dd;
}

// 3. 依據收支類型動態渲染科目選單
function updateCategories() {
    var txType = document.getElementById('txType').value;
    var mainCategorySelect = document.getElementById('mainCategory');
    mainCategorySelect.innerHTML = '';
    
    var categories = (txType === '收入') ? incomeCategories : expenseCategories;
    for (var i = 0; i < categories.length; i++) {
        var opt = document.createElement('option');
        opt.value = categories[i];
        opt.textContent = categories[i];
        mainCategorySelect.appendChild(opt);
    }
    
    // 如果是網頁初始狀態，強制指定科目為「管理費」
    if (txType === '收入') {
        mainCategorySelect.value = '管理費';
    }

    handleLogicChange();
}

// 4. 重點邏輯：控制樓層、方案的顯示與隱藏（只有 收入 + 管理費 才准許顯示）
function handleLogicChange() {
    var txType = document.getElementById('txType').value;
    var mainCategory = document.getElementById('mainCategory').value;
    var floorGroup = document.getElementById('floorGroup');
    var planGroup = document.getElementById('planGroup');
    var amountInput = document.getElementById('amount');
    
    if (txType === '收入' && mainCategory === '管理費') {
        floorGroup.style.display = 'flex';
        planGroup.style.display = 'flex';
    } else {
        // 其餘狀態直接隱藏，且清空裡面的值不准選擇
        floorGroup.style.display = 'none';
        planGroup.style.display = 'none';
        document.getElementById('floor').value = '';
        document.getElementById('paymentPlan').value = '';
        amountInput.value = '';
        amountInput.disabled = false;
    }
}

// 5. 方案自動帶入金額並鎖定輸入
function handlePlanPrice() {
    var planSelect = document.getElementById('paymentPlan');
    var selectedOpt = planSelect.options[planSelect.selectedIndex];
    var price = parseInt(selectedOpt.getAttribute('data-price') || '0', 10);
