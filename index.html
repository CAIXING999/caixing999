<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摘星樓費用收支管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(24, 188, 156, 0.3);
        }
        input:disabled, select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #6c757d;
        }
        /* 隱藏區塊樣式 */
        .hidden-group {
            display: none;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #128f76;
        }
        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌟 摘星樓費用收支管理系統</h2>
    
    <!-- 記帳表單 -->
    <div class="form-grid">
        <!-- 1. 交易日期 (預設當天) -->
        <div class="form-group">
            <label for="txDate">交易日期</label>
            <input type="date" id="txDate">
        </div>

        <!-- 2. 收支類型 (預設收入) -->
        <div class="form-group">
            <label for="txType">收支類型</label>
            <select id="txType" onchange="handleLogicChange()">
                <option value="收入" selected>收入</option>
                <option value="支出">支出</option>
            </select>
        </div>

        <!-- 主要科目 -->
        <div class="form-group">
            <label for="mainCategory">主要科目</label>
            <select id="mainCategory" onchange="handleLogicChange()">
                <option value="管理費">管理費</option>
                <option value="停車費">停車費</option>
                <option value="設備維護">設備維護</option>
                <option value="行政庶務">行政庶務</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <!-- 對應樓層 (動態啟用/停用) -->
        <div class="form-group">
            <label for="floor">對應樓層</label>
            <select id="floor">
                <option value="">-- 請選擇樓層 --</option>
                <option value="1F">1 樓</option>
                <option value="2F">2 樓</option>
                <option value="3F">3 樓</option>
                <option value="4F">4 樓</option>
                <option value="5F">5 樓</option>
            </select>
        </div>

        <!-- 繳交期數方案 (動態顯示/隱藏) -->
        <div class="form-group hidden-group" id="planGroup">
            <label for="paymentPlan">繳交期數方案</label>
            <select id="paymentPlan" onchange="handlePlanPrice()">
                <option value="" data-price="0">-- 請選擇方案 --</option>
                <option value="單月繳" data-price="1500">單月繳 ($1,500)</option>
                <option value="雙月繳" data-price="3000">雙月繳 ($3,000)</option>
                <option value="半年繳" data-price="8500">半年繳 (特惠 $8,500)</option>
                <option value="年繳" data-price="16000">年繳 (大特惠 $16,000)</option>
            </select>
        </div>

        <!-- 金額 (自動帶入或手動輸入) -->
        <div class="form-group">
            <label for="amount">金額</label>
            <input type="number" id="amount" placeholder="請輸入金額" min="0">
        </div>
    </div>

    <button onclick="addRecord()">➕ 新增收支紀錄</button>

    <!-- 歷史紀錄列表 -->
    <div class="table-container">
        <h3>📊 歷史收支明細</h3>
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>類型</th>
                    <th>科目</th>
                    <th>樓層</th>
                    <th>配置方案</th>
                    <th>金額</th>
                </tr>
            </thead>
            <tbody id="recordTableBody">
                <!-- 紀錄將由 JavaScript 動態插入 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 頁面載入完成後執行
    window.onload = function() {
        // 🛠️ 需求 1：交易日期預設顯示系統當下日期
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('txDate').value = today;

        // 初始化判斷邏輯
        handleLogicChange();
    };

    // 🛠️ 需求 2 & 3：核心欄位聯動邏輯
    function handleLogicChange() {
        const txType = document.getElementById('txType').value;
        const mainCategory = document.getElementById('mainCategory').value;
        
        const floorSelect = document.getElementById('floor');
        const planGroup = document.getElementById('planGroup');
        const paymentPlan = document.getElementById('paymentPlan');
        const amountInput = document.getElementById('amount');

        // 判斷是否符合條件：「收入」且主要科目為「管理費」
        if (txType === '收入' && mainCategory === '管理費') {
            // 樓層變為可選擇
            floorSelect.disabled = false;
            // 顯示繳交期數方案
            planGroup.style.display = 'flex';
        } else {
            // 否則：樓層不可選擇並清空
            floorSelect.disabled = true;
            floorSelect.value = '';
            // 隱藏期數方案並清空選值
            planGroup.style.display = 'none';
            paymentPlan.value = '';
            // 解鎖金額欄位供自由輸入
            amountInput.readOnly = false;
        }
    }

    // 🛠️ 需求 3 續：選定方案後，金額自動帶入
    function handlePlanPrice() {
        const paymentPlan = document.getElementById('paymentPlan');
        const amountInput = document.getElementById('amount');
        
        // 獲取選取 option 的客製化 data-price 屬性
        const selectedOption = paymentPlan.options[paymentPlan.selectedIndex];
        const price = selectedOption.getAttribute('data-price');

        if (price && price !== "0") {
            amountInput.value = price;
            amountInput.readOnly = true; // 自動帶入時鎖定金額，避免誤觸修改
        } else {
            amountInput.value = '';
            amountInput.readOnly = false;
        }
    }

    // 功能：新增紀錄到網頁表格中
    function addRecord() {
        const date = document.getElementById('txDate').value;
        const type = document.getElementById('txType').value;
        const category = document.getElementById('mainCategory').value;
        const floor = document.getElementById('floor').value || '無';
        const plan = document.getElementById('paymentPlan').value || '無';
        const amount = document.getElementById('amount').value;

        if (!amount) {
            alert('請填寫金額！');
            return;
        }

        const tbody = document.getElementById('recordTableBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${date}</td>
            <td style="color: ${type === '收入' ? '#18bc9c' : '#e74c3c'}; font-weight:bold;">${type}</td>
            <td>${category}</td>
            <td>${floor}</td>
            <td>${plan}</td>
            <td>$${Number(amount).toLocaleString()}</td>
        `;

        // 新增在最前面
        tbody.insertBefore(row, tbody.firstChild);

        // 儲存成功後重置方案與金額，日期保持當天
        document.getElementById('paymentPlan').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('amount').readOnly = false;
        handleLogicChange();
    }
</script>

</body>
