<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新的個人記帳</title>

<style>
:root{
 --bg:#f5f5f7;
 --card:#fff;
 --text:#111;
 --primary:#007aff;
 --secondary:#e5e5ea;
 --danger:#ff3b30;
}

@media (prefers-color-scheme: dark){
:root{
 --bg:#000;
 --card:#1c1c1e;
 --text:#fff;
 --secondary:#2c2c2e;
}
}

body{
 margin:0;
 padding:16px;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 background:var(--bg);
 color:var(--text);
}

h1{
 text-align:center;
}

.card{
 background:var(--card);
 padding:15px;
 border-radius:12px;
 margin-bottom:15px;
}

input,select{
 width:100%;
 padding:12px;
 margin-top:8px;
 margin-bottom:8px;
 border-radius:8px;
 border:1px solid #ccc;
 box-sizing:border-box;
 background:var(--card);
 color:var(--text);
}

button{
 border:none;
 padding:12px;
 border-radius:10px;
 cursor:pointer;
 font-size:15px;
}

.primary{
 background:var(--primary);
 color:white;
 width:100%;
}

.load-more{
 background:var(--secondary);
 color:var(--text);
 width:100%;
 margin-top:12px;
 font-weight:bold;
}

.edit{
 background:#ff9500;
 color:white;
}

.delete{
 background:var(--danger);
 color:white;
}

.row{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:8px;
}

.row button{
 flex:1;
}

.record{
 border-top:1px solid #ddd;
 padding:10px 0;
}

@media (prefers-color-scheme: dark){
 .record{
  border-top:1px solid #333;
 }
}

.money{
 font-size:20px;
 font-weight:bold;
}

.stat{
 margin:6px 0;
}

.small{
 font-size:12px;
 opacity:0.7;
}
</style>
</head>

<body>

<h1>💰 個人記帳</h1>

<div class="card">
<h3 id="formTitle">新增紀錄</h3>

<select id="type">
<option value="expense">支出</option>
<option value="income">收入</option>
</select>

<input id="amount" type="number" placeholder="金額">

<select id="category">
<option>飲食</option>
<option>交通</option>
<option>娛樂</option>
<option>購物</option>
<option>居家</option>
<option>投資</option>
<option>其他</option>
</select>

<input id="note" placeholder="備註">

<button class="primary" onclick="saveRecord()">儲存</button>
</div>

<div class="card">
<h3>篩選與搜尋</h3>
<select id="monthFilter" onchange="resetLimitAndRender()"></select>
<input id="search" placeholder="輸入關鍵字（可搜備註或分類）" oninput="debouncedRender()">
</div>

<div class="card">
<h3>統計</h3>
<div id="stats"></div>
</div>

<div class="card">
<h3>分類統計</h3>
<div id="categoryStats"></div>
</div>

<div class="card">
<button class="primary" onclick="exportCSV()">匯出CSV</button>
</div>

<div class="card">
<h3 id="recordHeader">紀錄列表</h3>
<div id="records"></div>
<button id="loadMoreBtn" class="load-more" style="display:none;" onclick="loadMore()">顯示更多</button>
</div>

<script>

let editId = null;
let data = [];
const PAGE_SIZE = 20;
let displayLimit = PAGE_SIZE;
let searchTimer = null;

// 取得 YYYY-MM 格式字串
function getYearMonth(dateObj) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, "0");
  return `${y}-${m}`;
}

const currentMonthStr = getYearMonth(new Date());

// ⚡ 1. 初始化 IndexedDB 資料庫
const dbName = "ExpenseTrackerDB";
const storeName = "expenses";
let db;

const request = indexedDB.open(dbName, 1);

request.onupgradeneeded = function(e) {
  let dbInstance = e.target.result;
  if (!dbInstance.objectStoreNames.contains(storeName)) {
    dbInstance.createObjectStore(storeName, { keyPath: "id" });
  }
};

request.onsuccess = function(e) {
  db = e.target.result;
  loadDataFromDB();
};

request.onerror = function(e) {
  console.error("IndexedDB 開啟失敗，降級使用 LocalStorage");
  data = JSON.parse(localStorage.getItem("expenses") || "[]");
  updateMonthOptions();
  render();
};

// ⚡ 2. 從 IndexedDB 讀取全部資料
function loadDataFromDB() {
  const transaction = db.transaction([storeName], "readonly");
  const store = transaction.objectStore(storeName);
  const getAllRequest = store.getAll();

  getAllRequest.onsuccess = function() {
    data = getAllRequest.result || [];
    data.sort((a, b) => a.id - b.id);
    updateMonthOptions();
    render();
  };
}

// ⚡ 3. 單筆精準寫入 / 更新 IndexedDB（不再整庫清空重寫）
function upsertDBRecord(item) {
  try {
    localStorage.setItem("expenses", JSON.stringify(data));
  } catch (err) {
    console.warn("LocalStorage 容量已滿，僅儲存於 IndexedDB");
  }

  if (!db) return;
  const transaction = db.transaction([storeName], "readwrite");
  const store = transaction.objectStore(storeName);
  store.put(item);
}

// ⚡ 4. 單筆精準刪除 IndexedDB 紀錄
function deleteDBRecord(id) {
  try {
    localStorage.setItem("expenses", JSON.stringify(data));
  } catch (err) {}

  if (!db) return;
  const transaction = db.transaction([storeName], "readwrite");
  const store = transaction.objectStore(storeName);
  store.delete(id);
}

// ⚡ 5. 動態更新月份篩選選單
function updateMonthOptions() {
  const select = document.getElementById("monthFilter");
  const prevValue = select.value || currentMonthStr;

  const monthSet = new Set([currentMonthStr]);
  data.forEach(item => {
    monthSet.add(getYearMonth(new Date(item.date)));
  });

  // 由新到舊排序月份
  const sortedMonths = Array.from(monthSet).sort().reverse();

  let optionsHtml = `<option value="ALL">📅 全部月份</option>`;
  sortedMonths.forEach(ym => {
    const label = ym === currentMonthStr ? `${ym}（本月）` : ym;
    optionsHtml += `<option value="${ym}">${label}</option>`;
  });

  select.innerHTML = optionsHtml;
  select.value = (prevValue === "ALL" || monthSet.has(prevValue)) ? prevValue : currentMonthStr;
}

function saveRecord() {
  let amount = parseFloat(document.getElementById("amount").value);

  if (!amount) {
    alert("請輸入金額");
    return;
  }

  // 如果是編輯模式，保留原本的建立日期；新增模式才使用當下時間
  let originalDate = new Date().toISOString();
  if (editId) {
    const existing = data.find(x => x.id === editId);
    if (existing) originalDate = existing.date;
  }

  let item = {
    id: editId ?? Date.now(),
    type: document.getElementById("type").value,
    amount,
    category: document.getElementById("category").value,
    note: document.getElementById("note").value,
    date: originalDate
  };

  if (editId) {
    data = data.map(x => x.id === editId ? item : x);
    editId = null;
    document.getElementById("formTitle").innerText = "新增紀錄";
  } else {
    data.push(item);
  }

  upsertDBRecord(item);
  updateMonthOptions();

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";

  render();
}

function editRecord(id) {
  let r = data.find(x => x.id === id);
  if (!r) return;

  editId = id;
  document.getElementById("formTitle").innerText = "修改紀錄";

  document.getElementById("type").value = r.type;
  document.getElementById("amount").value = r.amount;
  document.getElementById("category").value = r.category;
  document.getElementById("note").value = r.note;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function deleteRecord(id) {
  if (!confirm("確定刪除？")) return;

  data = data.filter(x => x.id !== id);
  deleteDBRecord(id);
  updateMonthOptions();
  render();
}

// 搜尋框防抖，避免打字時連續重繪
function debouncedRender() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    displayLimit = PAGE_SIZE;
    render();
  }, 250);
}

function resetLimitAndRender() {
  displayLimit = PAGE_SIZE;
  render();
}

function loadMore() {
  displayLimit += PAGE_SIZE;
  render();
}

function render() {
  let keyword = document.getElementById("search").value.toLowerCase().trim();
  let selectedMonth = document.getElementById("monthFilter").value || currentMonthStr;

  let today = 0;
  let week = 0;
  let selectedPeriodNet = 0;
  let categoryMap = {};
  let now = new Date();

  // 先從全部資料計算「今日」與「本週」即時統計
  data.forEach(r => {
    let d = new Date(r.date);
    let value = r.type === "expense" ? -r.amount : r.amount;

    if (d.toDateString() === now.toDateString()) {
      today += value;
    }
    if ((now - d) / (1000 * 60 * 60 * 24) < 7) {
      week += value;
    }
  });

  // 依照「月份」與「關鍵字」過濾列表
  let filteredList = data.filter(r => {
    let matchMonth = (selectedMonth === "ALL") || (getYearMonth(new Date(r.date)) === selectedMonth);
    let matchKeyword = !keyword ||
      (r.note && r.note.toLowerCase().includes(keyword)) ||
      (r.category && r.category.toLowerCase().includes(keyword));
    return matchMonth && matchKeyword;
  });

  // 計算篩選範圍內的總結與分類統計
  filteredList.forEach(r => {
    let value = r.type === "expense" ? -r.amount : r.amount;
    selectedPeriodNet += value;

    if (!categoryMap[r.category]) {
      categoryMap[r.category] = 0;
    }
    categoryMap[r.category] += r.amount;
  });

  // 反轉順序（最新在最上面），並只切出前 displayLimit 筆來渲染 DOM
  let reversedList = filteredList.slice().reverse();
  let visibleList = reversedList.slice(0, displayLimit);

  let html = "";
  visibleList.forEach(r => {
    html += `
    <div class="record">
      <div><strong>${r.note || "未命名"}</strong></div>
      <div>${r.category}</div>
      <div class="money">
      ${r.type === "income" ? "🟢" : "🔴"}
      NT$${r.amount}
      </div>
      <div class="small">
      ${new Date(r.date).toLocaleString()}
      </div>

      <div class="row">
        <button class="edit" onclick="editRecord(${r.id})">修改</button>
        <button class="delete" onclick="deleteRecord(${r.id})">刪除</button>
      </div>
    </div>`;
  });

  document.getElementById("recordHeader").innerText = `紀錄列表（共 ${filteredList.length} 筆）`;
  document.getElementById("records").innerHTML = html || "尚無資料";

  // 控制「顯示更多」按鈕的顯示與剩餘筆數提示
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  const remaining = filteredList.length - visibleList.length;
  if (remaining > 0) {
    loadMoreBtn.style.display = "block";
    loadMoreBtn.innerText = `顯示更多（還有 ${remaining} 筆）`;
  } else {
    loadMoreBtn.style.display = "none";
  }

  const periodLabel = selectedMonth === "ALL" ? "篩選總計" : `${selectedMonth} 結餘`;
  document.getElementById("stats").innerHTML = `
    <div class="stat">今日：NT$ ${today}</div>
    <div class="stat">本週：NT$ ${week}</div>
