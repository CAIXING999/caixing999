<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多人共用記帳本</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--primary:#007aff;--secondary:#e5e5ea;--danger:#ff3b30}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--secondary:#2c2c2e}}
body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text)}
h1{text-align:center}
.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;background:var(--card);color:var(--text)}
button{border:none;padding:12px;border-radius:10px;cursor:pointer;font-size:15px}
.primary{background:var(--primary);color:#fff;width:100%}
.load-more{background:var(--secondary);color:var(--text);width:100%;margin-top:12px;font-weight:bold}
.edit{background:#ff9500;color:#fff}
.delete{background:var(--danger);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.row button{flex:1}
.record{border-top:1px solid #ddd;padding:10px 0}
@media (prefers-color-scheme:dark){.record{border-top:1px solid #333}}
.money{font-size:20px;font-weight:bold}
.stat{margin:6px 0}
.small{font-size:12px;opacity:.7}
.sync-status{text-align:center;font-size:13px;color:#007aff;margin-bottom:10px}
</style>
<!-- 引入 Firebase SDK (v10 模組化版本) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, setDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 使用你剛剛提供的專案設定
  const firebaseConfig = {
    apiKey: "AIzaSyBKzdhel0LCAXv9qoGOdVMQ_K_KhBRpdzk",
    authDomain: "personal-account-124.firebaseapp.com",
    projectId: "personal-account-124",
    storageBucket: "personal-account-124.firebasestorage.app",
    messagingSenderId: "531857933748",
    appId: "1:531857933748:web:e7d6afe199bf507f885ee1",
    measurementId: "G-Z9MVZ43E4J"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let editId = null, data = [], displayLimit = 20, searchTimer = null;
  const PAGE_SIZE = 20;
  const getYearMonth = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  const currentMonthStr = getYearMonth(new Date());

  // 即時監聽遠端資料庫變更（達到即時共同編輯效果）
  onSnapshot(collection(db, "expenses"), (snapshot) => {
    data = [];
    snapshot.forEach((doc) => {
      data.push(doc.data());
    });
    data.sort((a, b) => a.id - b.id);
    updateMonthOptions();
    render();
    document.getElementById("syncStatus").innerText = "🟢 已與雲端同步（可多人協作）";
  }, (error) => {
    console.error("同步失敗：", error);
    document.getElementById("syncStatus").innerText = "🔴 雲端連線失敗，請檢查設定";
  });

  window.updateMonthOptions = function() {
    const sel = document.getElementById("monthFilter"), prev = sel.value || currentMonthStr, set = new Set([currentMonthStr]);
    data.forEach(i => { if (i.date) set.add(getYearMonth(new Date(i.date))); });
    let h = `<option value="ALL">📅 全部月份</option>`;
    Array.from(set).sort().reverse().forEach(ym => { h += `<option value="${ym}">${ym === currentMonthStr ? ym + "（本月）" : ym}</option>`; });
    sel.innerHTML = h; sel.value = (prev === "ALL" || set.has(prev)) ? prev : currentMonthStr;
  }

  window.saveRecord = async function() {
    let amount = parseFloat(document.getElementById("amount").value);
    if (!amount) return alert("請輸入金額");
    let originalDate = new Date().toISOString();
    if (editId) { const ex = data.find(x => x.id === editId); if (ex) originalDate = ex.date; }
    
    let id = editId ?? Date.now();
    let item = {
      id,
      type: document.getElementById("type").value,
      amount,
      category: document.getElementById("category").value,
      note: document.getElementById("note").value,
      date: originalDate
    };

    try {
      await setDoc(doc(db, "expenses", String(id)), item);
      editId = null;
      document.getElementById("formTitle").innerText = "新增紀錄";
      document.getElementById("amount").value = "";
      document.getElementById("note").value = "";
    } catch (e) {
      alert("儲存失敗：" + e.message);
    }
  }

  window.editRecord = function(id) {
    let r = data.find(x => x.id === id); if (!r) return;
    editId = id; document.getElementById("formTitle").innerText = "修改紀錄";
    document.getElementById("type").value = r.type; document.getElementById("amount").value = r.amount;
    document.getElementById("category").value = r.category; document.getElementById("note").value = r.note;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  window.deleteRecord = async function(id) {
    if (!confirm("確定刪除？")) return;
    try {
      await deleteDoc(doc(db, "expenses", String(id)));
    } catch (e) {
      alert("刪除失敗：" + e.message);
    }
  }

  window.debouncedRender = function() { clearTimeout(searchTimer); searchTimer = setTimeout(() => { displayLimit = PAGE_SIZE; render(); }, 250); }
  window.resetLimitAndRender = function() { displayLimit = PAGE_SIZE; render(); }
  window.loadMore = function() { displayLimit += PAGE_SIZE; render(); }

  window.render = function() {
    let kw = document.getElementById("search").value.toLowerCase().trim(), sm = document.getElementById("monthFilter").value || currentMonthStr;
    let today = 0, week = 0, net = 0, budgetTotal = 0, expenseTotal = 0, catMap = {}, now = new Date();
    
    data.forEach(r => {
      if (r.type === "budget") return;
      let d = new Date(r.date), v = r.type === "expense" ? -r.amount : r.amount;
      if (d.toDateString() === now.toDateString()) today += v;
      if ((now - d) / 864e5 < 7) week += v;
    });

    let list = data.filter(r => (sm === "ALL" || getYearMonth(new Date(r.date)) === sm) && (!kw || (r.note && r.note.toLowerCase().includes(kw)) || (r.category && r.category.toLowerCase().includes(kw))));
    
    list.forEach(r => {
      if (r.type === "budget") { budgetTotal += r.amount; return; }
      if (r.type === "expense") expenseTotal += r.amount;
      net += (r.type === "expense" ? -r.amount : r.amount);
      catMap[r.category] = (catMap[r.category] || 0) + r.amount;
    });

    let vis = list.slice().reverse().slice(0, displayLimit);
    document.getElementById("records").innerHTML = vis.map(r => {
      let icon = r.type === "income" ? "🟢" : (r.type === "budget" ? "🔵 預算" : "🔴");
      return `<div class="record"><div><strong>${r.note || (r.type === "budget" ? "本月預算" : "未命名")}</strong></div><div>${r.category}</div><div class="money">${icon} NT$${r.amount}</div><div class="small">${new Date(r.date).toLocaleString()}</div><div class="row"><button class="edit" onclick="editRecord(${r.id})">修改</button><button class="delete" onclick="deleteRecord(${r.id})">刪除</button></div></div>`;
    }).join("") || "尚無資料";

    document.getElementById("recordHeader").innerText = `紀錄列表（共 ${list.length} 筆）`;
    const btn = document.getElementById("loadMoreBtn"), rem = list.length - vis.length;
    btn.style.display = rem > 0 ? "block" : "none"; if (rem > 0) btn.innerText = `顯示更多（還有 ${rem} 筆）`;
    
    let budgetHtml = budgetTotal > 0 ? `<div class="stat">🔵 預算：NT$ ${budgetTotal}（剩餘 <strong>NT$ ${budgetTotal - expenseTotal}</strong>）</div>` : "";
    document.getElementById("stats").innerHTML = `<div class="stat">今日：NT$ ${today}</div><div class="stat">本週：NT$ ${week}</div><div class="stat"><strong>${sm === "ALL" ? "篩選總計" : sm + " 結餘"}：NT$ ${net}</strong></div>${budgetHtml}`;
    document.getElementById("categoryStats").innerHTML = Object.keys(catMap).map(k => `<div>${k}：NT$ ${catMap[k]}</div>`).join("") || "尚無資料";
  }

  window.exportCSV = function() {
    let csv = "\uFEFF類型,金額,分類,備註,日期\n" + data.map(r => `${r.type},${r.amount},${r.category},"${(r.note || "").replace(/"/g, '""')}",${r.date}`).join("\n");
    let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" })); a.download = "expense-data.csv"; a.click();
  }
</script>
</head>
<body>
<h1>💰 個人<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個人記帳</title>

<style>
:root{
 --bg:#f5f5f7;
 --card:#fff;
 --text:#111;
 --primary:#007aff;
 --danger:#ff3b30;
}

@media (prefers-color-scheme: dark){
:root{
 --bg:#000;
 --card:#1c1c1e;
 --text:#fff;
}
}

body{
 margin:0;
 padding:16px;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 background:var(--bg);
 color:var(--text);
 font-size:18px;
}

h1{
 text-align:center;
 font-size:32px;
}

h3{
 font-size:22px;
 margin-top:4px;
 margin-bottom:12px;
}

.card{
 background:var(--card);
 padding:16px;
 border-radius:12px;
 margin-bottom:16px;
}

input,select{
 width:100%;
 padding:14px;
 margin-top:8px;
 margin-bottom:8px;
 border-radius:8px;
 border:1px solid #ccc;
 box-sizing:border-box;
 background:var(--card);
 color:var(--text);
 font-size:18px;
}

button{
 border:none;
 padding:14px;
 border-radius:10px;
 cursor:pointer;
 font-size:18px;
}

.primary{
 background:var(--primary);
 color:white;
 width:100%;
 font-weight:bold;
}

.edit{
 background:#ff9500;
 color:white;
}

.delete{
 background:var(--danger);
 color:white;
}

.row{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:8px;
}

.row button{
 flex:1;
}

.record{
 border-top:1px solid #ddd;
 padding:12px 0;
}

.money{
 font-size:24px;
 font-weight:bold;
 margin:4px 0;
}

.stat{
 margin:8px 0;
}

.small{
 font-size:15px;
 opacity:0.7;
}
</style>
</head>

<body>

<h1>💰 個人記帳</h1>

<div class="card">
<h3>新增紀錄</h3>

<select id="type">
<option value="expense">支出</option>
<option value="income">收入</option>
</select>

<input id="amount" type="number" placeholder="金額">

<select id="category">
<option>飲食</option>
<option>交通</option>
<option>娛樂</option>
<option>購物</option>
<option>居家</option>
<option>投資</option>
<option>教育</option>
<option>稅金</option>
<option>保險</option>
<option>其他</option>
</select>

<input id="note" placeholder="備註">

<button class="primary" onclick="saveRecord()">儲存</button>
</div>

<div class="card">
<h3>搜尋</h3>
<input id="search" placeholder="輸入關鍵字" oninput="render()">
</div>

<div class="card">
<h3>統計</h3>
<div id="stats"></div>
</div>

<div class="card">
<h3>分類統計</h3>
<div id="categoryStats"></div>
</div>

<div class="card">
<button class="primary" onclick="exportCSV()">匯出CSV</button>
</div>

<div class="card">
<h3>紀錄列表</h3>
<div id="records"></div>
</div>

<script>

let editId=null;
let data=[];

// ⚡ 1. 初始化 IndexedDB 資料庫
const dbName = "ExpenseTrackerDB";
const storeName = "expenses";
let db;

const request = indexedDB.open(dbName, 1);

request.onupgradeneeded = function(e) {
  let dbInstance = e.target.result;
  if (!dbInstance.objectStoreNames.contains(storeName)) {
    dbInstance.createObjectStore(storeName, { keyPath: "id" });
  }
};

request.onsuccess = function(e) {
  db = e.target.result;
  loadDataFromDB(); // 資料庫開啟成功後，讀取舊資料
};

request.onerror = function(e) {
  console.error("IndexedDB 開啟失敗，降級使用 LocalStorage");
  data = JSON.parse(localStorage.getItem("expenses") || "[]");
  render();
};

// ⚡ 2. 從 IndexedDB 讀取全部資料的函式
function loadDataFromDB() {
  const transaction = db.transaction([storeName], "readonly");
  const store = transaction.objectStore(storeName);
  const getAllRequest = store.getAll();

  getAllRequest.onsuccess = function() {
    data = getAllRequest.result || [];
    // 確保資料按時間排序（舊到新），維持跟您原本一致的邏輯
    data.sort((a, b) => a.id - b.id);
    render();
  };
}

// ⚡ 3. 將整組資料同步寫入 IndexedDB 與備份的函式
function saveData() {
  // 同步備份到原本的 LocalStorage
  localStorage.setItem("expenses", JSON.stringify(data));

  if (!db) return;
  
  // 清空資料庫並重新寫入最新狀態（最穩妥的整組同步做法）
  const transaction = db.transaction([storeName], "readwrite");
  const store = transaction.objectStore(storeName);
  
  const clearRequest = store.clear();
  clearRequest.onsuccess = function() {
    data.forEach(item => {
      store.add(item);
    });
  };
}

function saveRecord(){
 let amount=parseFloat(document.getElementById("amount").value);

 if(!amount){
   alert("請輸入金額");
   return;
 }

 let item={
   id:editId ?? Date.now(),
   type:document.getElementById("type").value,
   amount,
   category:document.getElementById("category").value,
   note:document.getElementById("note").value,
   date:new Date().toISOString()
 };

 if(editId){
   data=data.map(x=>x.id===editId?item:x);
   editId=null;
 }
 else{
   data.push(item);
 }

 saveData();

 document.getElementById("amount").value="";
 document.getElementById("note").value="";

 render();
}

function editRecord(id){
 let r=data.find(x=>x.id===id);

 editId=id;

 document.getElementById("type").value=r.type;
 document.getElementById("amount").value=r.amount;
 document.getElementById("category").value=r.category;
 document.getElementById("note").value=r.note;

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });
}

function deleteRecord(id){
 if(!confirm("確定刪除？")) return;

 data=data.filter(x=>x.id!==id);

 saveData();

 render();
}

function render(){
 let keyword=document.getElementById("search").value.toLowerCase();

 let list=data.filter(x=>
   x.note.toLowerCase().includes(keyword)
 );

 let today=0;
 let week=0;
 let month=0;

 let categoryMap={};
 let html="";
 let now=new Date();

 list.slice().reverse().forEach(r=>{
   let d=new Date(r.date);
   let value=r.type==="expense" ? -r.amount : r.amount;

   if(d.toDateString()===now.toDateString())
     today+=value;

   if((now-d)/(1000*60*60*24)<7)
     week+=value;

   if(
      d.getMonth()===now.getMonth() &&
      d.getFullYear()===now.getFullYear()
   )
     month+=value;

   if(!categoryMap[r.category])
      categoryMap[r.category]=0;

   categoryMap[r.category]+=r.amount;

   html+=`
   <div class="record">
      <div><strong>${r.note||"未命名"}</strong></div>
      <div>${r.category}</div>
      <div class="money">
      ${r.type==="income"?"🟢":"🔴"}
      NT$${r.amount}
      </div>
      <div class="small">
      ${new Date(r.date).toLocaleString()}
      </div>

      <div class="row">
        <button class="edit" onclick="editRecord(${r.id})">修改</button>
        <button class="delete" onclick="deleteRecord(${r.id})">刪除</button>
      </div>
   </div>`;
 });

 document.getElementById("records").innerHTML=html || "尚無資料";

 document.getElementById("stats").innerHTML=`
 <div class="stat">今日：NT$ ${today}</div>
 <div class="stat">本週：NT$ ${week}</div>
 <div class="stat">本月：NT$ ${month}</div>
 `;

 let catHtml="";
 for(let key in categoryMap){
   catHtml+=`<div class="stat">${key}：NT$ ${categoryMap[key]}</div>`;
 }

 document.getElementById("categoryStats").innerHTML=catHtml || "尚無資料";
}

function exportCSV(){
 let csv="類型,金額,分類,備註,日期\n";

 data.forEach(r=>{
   csv+=`${r.type},${r.amount},${r.category},${r.note},${r.date}\n`;
 });

 let blob=new Blob([csv],{
   type:"text/csv;charset=utf-8;"
 });

 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="expense-data.csv";
 a.click();
}

</script>

</body>
</html>
