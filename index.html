<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>摘星樓收支管理手帳</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --input-bg: #ffffff;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --primary-blue: #007aff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--input-bg);
            color: #000000;
            font-size: 16px;
            outline: none;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='10' height='10' viewBox='0 0 10 10'><path d='M0 3l5 5 5-5z' fill='%23007aff'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-blue);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-submit:active {
            opacity: 0.8;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 16px;
            border-bottom: 1px solid #2c2c2e;
        }

        .stat-row:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 4px;
        }

        .ledger-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2c2c2e;
        }

        .ledger-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ledger-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .ledger-meta {
            font-size: 14px;
        }

        .ledger-memo {
            font-size: 12px;
            color: var(--text-muted);
        }

        .ledger-amount-action {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .amount-in { color: #4cd964; }
        .amount-out { color: #ff3b30; }

        .btn-delete {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
        }
    </style>
</head>
<body>

    <header>
        💰 摘星樓收支管理手帳
    </header>

    <!-- 新增紀錄 -->
    <div class="card">
        <div class="card-title">新增紀錄</div>
        <form id="recordForm">
            <div class="form-group">
                <select id="typeSelect">
                    <option value="支出">支出</option>
                    <option value="收入">收入</option>
                </select>
            </div>
            <div class="form-group">
                <input type="date" id="dateInput" required>
            </div>
            <div class="form-group">
                <input type="number" id="amountInput" placeholder="金額" required min="1">
            </div>
            <div class="form-group">
                <select id="categorySelect">
                    <!-- 動態載入 -->
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="memoInput" placeholder="備註">
            </div>
            <button type="submit" class="btn-submit">儲存</button>
        </form>
    </div>

    <!-- 搜尋 -->
    <div class="card">
        <div class="card-title">搜尋</div>
        <input type="text" id="searchInput" placeholder="輸入關鍵字">
    </div>

    <!-- 歷史流水帳 -->
    <div class="card">
        <div class="card-title">歷史明細</div>
        <div id="ledgerList">
            <!-- 歷史紀錄將顯示在此 -->
        </div>
    </div>

    <!-- 統計 -->
    <div class="card">
        <div class="card-title">統計</div>
        <div class="stat-row">今日：<span id="statToday">NT$ 0</span></div>
        <div class="stat-row">本週：<span id="statWeekly">NT$ 0</span></div>
        <div class="stat-row">本月：<span id="statMonthly">NT$ 0</span></div>
        <div class="stat-row">今年：<span id="statYearly">NT$ 0</span></div>
        <div class="stat-row" style="color: #ffcc00;">年度結餘：<span id="statTotalBalance">NT$ 120,662</span></div>
    </div>

    <script>
        const INITIAL_BALANCE = 120662;
        const incomeCategories = ["管理費", "其他"];
        const expenseCategories = ["清潔費", "電梯保養費", "公設電費", "消防申報費", "電梯代辦檢查及證照費", "其他"];

        let records = JSON.parse(localStorage.getItem('zhaxinglou_records')) || [];

        const typeSelect = document.getElementById('typeSelect');
        const categorySelect = document.getElementById('categorySelect');
        const dateInput = document.getElementById('dateInput');
        const recordForm = document.getElementById('recordForm');
        const searchInput = document.getElementById('searchInput');

        // 初始化日期為當天
        function initDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;
        }

        // 更新分類選單
        function updateCategories() {
            categorySelect.innerHTML = '';
            const categories = typeSelect.value === '收入' ? incomeCategories : expenseCategories;
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
        }

        typeSelect.addEventListener('change', updateCategories);

        // 儲存紀錄
        recordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const record = {
                id: Date.now(),
                type: typeSelect.value,
                date: dateInput.value,
                amount: parseInt(document.getElementById('amountInput').value),
                category: categorySelect.value,
                memo: document.getElementById('memoInput').value.trim()
            };

            records.push(record);
            saveAndRender();
            
            // 重置表單但保持當日日期
            document.getElementById('amountInput').value = '';
            document.getElementById('memoInput').value = '';
            initDate();
        });

        function deleteRecord(id) {
            if(confirm('確定要刪除這筆紀錄嗎？')) {
                records = records.filter(r => r.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('zhaxinglou_records', JSON.stringify(records));
            render();
        }

        // 時間區間判斷常規邏輯
        function isSameDay(d1, d2) { return d1.toDateString() === d2.toDateString(); }
        function isSameWeek(d1, d2) {
            const oneDay = 24 * 60 * 60 * 1000;
            const diff = Math.abs(d1 - d2);
            return diff < 7 * oneDay && d1.getDay() >= d2.getDay() && d1.getFullYear() === d2.getFullYear();
        }
        function isSameMonth(d1, d2) { return d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear(); }
        function isSameYear(d1, d2) { return d1.getFullYear() === d2.getFullYear(); }

        function render() {
            const keyword = searchInput.value.toLowerCase();
            const ledgerList = document.getElementById('ledgerList');
            ledgerList.innerHTML = '';

            let todaySum = 0, weekSum = 0, monthSum = 0, yearSum = 0, totalNet = 0;
            const now = new Date();

            // 由新到舊排序
            const sortedRecords = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedRecords.forEach(r => {
                const rDate = new Date(r.date);
                const amt = r.type === '收入' ? r.amount : -r.amount;

                // 計算統計
                if (isSameDay(now, rDate)) todaySum += amt;
                if (isSameWeek(now, rDate)) weekSum += amt;
                if (isSameMonth(now, rDate)) monthSum += amt;
                if (isSameYear(now, rDate)) yearSum += amt;
