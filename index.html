<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摘星樓費用收支管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(24, 188, 156, 0.3);
        }
        input:disabled, select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #6c757d;
        }
        .hidden-group {
            display: none;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #128f76;
        }
        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌟 摘星樓費用收支管理系統</h2>
    
    <!-- 記帳表單 -->
    <div class="form-grid">
        <!-- 1. 交易日期 (預設當天) -->
        <div class="form-group">
            <label for="txDate">交易日期</label>
            <input type="date" id="txDate">
        </div>

        <!-- 2. 收支類型 (預設收入) -->
        <div class="form-group">
            <label for="txType">收支類型</label>
            <select id="txType" onchange="updateCategories(); handleLogicChange();">
                <option value="收入" selected>收入</option>
                <option value="支出">支出</option>
            </select>
        </div>

        <!-- 主要科目 (隨收支類型動態改變選項) -->
        <div class="form-group">
            <label for="mainCategory">主要科目</label>
            <select id="mainCategory" onchange="handleLogicChange()">
                <!-- JS 動態帶入 -->
            </select>
        </div>

        <!-- 對應樓層 (2F 至 7F) -->
        <div class="form-group">
            <label for="floor">對應樓層</label>
            <select id="floor">
                <option value="">-- 請選擇樓層 --</option>
                <option value="2F">2 樓</option>
                <option value="3F">3 樓</option>
                <option value="4F">4 樓</option>
                <option value="5F">5 樓</option>
                <option value="6F">6 樓</option>
                <option value="7F">7 樓</option>
            </select>
        </div>

        <!-- 繳交期數方案 -->
        <div class="form-group hidden-group" id="planGroup">
            <label for="paymentPlan">繳交期數方案</label>
            <select id="paymentPlan" onchange="handlePlanPrice()">
                <option value="" data-price="0">-- 請選擇方案 --</option>
                <option value="雙月繳" data-price="3000">雙月繳 ($3,000)</option>
                <option value="半年繳" data-price="9000">半年繳 ($9,000)</option>
                <option value="年繳" data-price="18000">年繳 ($18,000)</option>
            </select>
        </div>

        <!-- 金額 -->
        <div class="form-group">
            <label for="amount">金額</label>
            <input type="number" id="amount" placeholder="請輸入金額" min="0">
        </div>
    </div>

    <button onclick="addRecord()">➕ 新增收支紀錄</button>

    <!-- 歷史紀錄列表 -->
    <div class="table-container">
        <h3>📊 歷史收支明細</h3>
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>類型</th>
                    <th>科目</th>
                    <th>樓層</th>
                    <th>配置方案</th>
                    <th>金額</th>
                </tr>
            </thead>
            <tbody id="recordTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // 收支項目的常數定義
    const incomeCategories = ["管理費", "其他"];
    const expenseCategories = [
        "電梯保養費", 
        "清潔費", 
        "公設電費", 
        "電梯代辦檢驗及證照費", 
        "消防申報費", 
        "其他"
    ];

    window.onload = function() {
        // 預設今天日期
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('txDate').value = today;

        // 初始化科目與介面邏輯
        updateCategories();
        handleLogicChange();
    };

    // 依據「收入/支出」更新主要科目的下拉選單
    function updateCategories() {
        const txType = document.getElementById('txType').value;
        const mainCategory = document.getElementById('mainCategory');
        
        mainCategory.innerHTML = '';
        const list = (txType === '收入') ? incomeCategories : expenseCategories;
        
        list.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.textContent = item;
            mainCategory.appendChild(opt);
        });
    }

    // 連動防呆邏輯
    function handleLogicChange() {
        const txType = document.getElementById('txType').value;
        const mainCategory = document.getElementById('mainCategory').value;
        
        const floorSelect = document.getElementById('floor');
        const planGroup = document.getElementById('planGroup');
        const paymentPlan = document.getElementById('paymentPlan');
        const amountInput = document.getElementById('amount');

        if (txType === '收入' && mainCategory === '管理費') {
            floorSelect.disabled = false;
            planGroup.style.style.display = 'flex';
        } else {
            floorSelect.disabled = true;
            floorSelect.value = '';
            planGroup.style.display = 'none';
            paymentPlan.value = '';
            amountInput.readOnly = false;
        }
    }

    // 選定方案後，金額嚴格依 2個月 3000 元等比例精準帶入，不打折
    function handlePlanPrice() {
        const paymentPlan = document.getElementById('paymentPlan');
        const amountInput = document.getElementById('amount');
        
        const selectedOption = paymentPlan.options[paymentPlan.selectedIndex];
        const price = selectedOption.getAttribute('data-price');

        if (price && price !== "0") {
            amountInput.value = price;
            amountInput.readOnly = true; 
        } else {
            amountInput.value = '';
            amountInput.readOnly = false;
        }
    }

    function addRecord() {
        const date = document.getElementById('txDate').value;
        const type = document.getElementById('txType').value;
        const category = document.getElementById('mainCategory').value;
        const floor = document.getElementById('floor').value || '無';
        const plan = document.getElementById('paymentPlan').value || '無';
        const amount = document.getElementById('amount').value;

        if (!amount) {
            alert('請填寫金額！');
            return;
        }

        const tbody = document.getElementById('recordTableBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${date}</td>
            <td style="color: ${type === '收入' ? '#18bc9c' : '#e74c3c'}; font-weight:bold;">${type}</td>
            <td>${category}</td>
            <td>${floor}</td>
            <td>${plan}</td>
            <td>$${Number(amount).toLocaleString()}</td>
        `;

        tbody.insertBefore(row, tbody.firstChild);

        document.getElementById('paymentPlan').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('amount').readOnly = false;
        handleLogicChange();
    }
</script>

</body>
</html>
