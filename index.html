<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摘星樓費用收支管理</title>
    <!-- 引入 Tailwind CSS 用於精美的手機/電腦響應式介面 -->
    <script src="https://jsdelivr.net"></script>
    <!-- 引入 Chart.js 用於渲染年度收支圖表 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">

    <!-- 導覽列 -->
    <nav class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🏢 摘星樓費用收支管理 <span class="text-xs bg-indigo-500 px-2 py-0.5 rounded">v1.1</span>
            </h1>
            <div class="flex items-center gap-2">
                <label for="yearFilter" class="text-sm font-medium">切換統計年度：</label>
                <select id="yearFilter" onchange="changeYear()" class="bg-indigo-700 text-white rounded px-2 py-1 text-sm border border-indigo-500 focus:outline-none">
                    <option value="2026">2026 年</option>
                    <option value="2027">2027 年</option>
                    <option value="2025">2025 年</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：核心看板與記帳表單 -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- 年度餘額統計看板 -->
            <div class="bg-white rounded-xl shadow-sm p-6 grid grid-cols-3 gap-4 border border-gray-100">
                <div class="bg-emerald-50 p-4 rounded-lg">
                    <p class="text-xs text-emerald-600 font-medium">年度總收入</p>
                    <p class="text-xl font-bold text-emerald-700 mt-1">$<span id="totalIncome">0</span></p>
                </div>
                <div class="bg-rose-50 p-4 rounded-lg">
                    <p class="text-xs text-rose-600 font-medium">年度總支出</p>
                    <p class="text-xl font-bold text-rose-700 mt-1">$<span id="totalExpense">0</span></p>
                </div>
                <div class="p-4 rounded-lg id-balance-card bg-blue-50" id="balanceCard">
                    <p class="text-xs text-blue-600 font-medium">年度結餘 (餘額)</p>
                    <p class="text-xl font-bold text-blue-700 mt-1">$<span id="annualBalance">0</span></p>
                </div>
            </div>

            <!-- 2-7樓管理費繳費進度追蹤看板 -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                        📊 2-7樓 管理費繳費進度追蹤 <span class="text-xs font-normal text-gray-500">(基準: 1,500元/月)</span>
                    </h2>
                    <button onclick="batchGenerateManagementFee()" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 text-xs font-medium py-1.5 px-3 rounded-lg transition duration-200 flex items-center gap-1">
                        ⚡ 一鍵生成全棟當月管理費
                    </button>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="floorTrackerGrid">
                    <!-- 由 JavaScript 動態渲染 2-7 樓狀況 -->
                </div>
            </div>

            <!-- 記帳輸入表單 -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <h2 class="text-lg font-bold text-gray-700 mb-4">✍️ 新增收支紀錄</h2>
                <form id="financeForm" onsubmit="addRecord(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">交易日期</label>
                            <input type="date" id="recordDate" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">收支類型</label>
                            <div class="flex gap-4 mt-2">
                                <label class="flex items-center text-sm font-medium text-emerald-600 cursor-pointer">
                                    <input type="radio" name="type" value="收入" checked onchange="toggleTypeFields()" class="mr-1.5 h-4 w-4 text-emerald-600 focus:ring-emerald-500"> 收入
                                </label>
                                <label class="flex items-center text-sm font-medium text-rose-600 cursor-pointer">
                                    <input type="radio" name="type" value="支出" onchange="toggleTypeFields()" class="mr-1.5 h-4 w-4 text-rose-600 focus:ring-rose-500"> 支出
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">主要科目項目</label>
                            <select id="recordCategory" onchange="handleCategoryChange()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <!-- 收入項目 -->
                                <optgroup label="收入類" id="optIncome">
                                    <option value="管理費">管理費</option>
                                    <option value="其他收入">其他收入</option>
                                </optgroup>
                                <!-- 支出項目 -->
                                <optgroup label="支出類" id="optExpense" class="hidden">
                                    <option value="電梯保養費">電梯保養費</option>
                                    <option value="清潔費">清潔費</option>
                                    <option value="公設電費">公設電費</option>
                                    <option value="電梯代辦檢查及證照費">電梯代辦檢查及證照費</option>
                                    <option value="消防申報費">消防申報費</option>
                                    <option value="水塔清洗費用">水塔清洗費用</option>
                                    <option value="春節獎金">春節獎金</option>
                                    <option value="其他支出">其他支出</option>
                                </optgroup>
                            </select>
                        </div>
                        
                        <div id="floorSelectWrapper">
                            <label class="block text-sm font-medium text-gray-600 mb-1">對應樓層 (一層一戶)</label>
                            <select id="recordFloor" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="無">非住戶公用項目</option>
                                <option value="2樓">2 樓</option>
                                <option value="3樓">3 樓</option>
                                <option value="4樓">4 樓</option>
                                <option value="5樓">5 樓</option>
                                <option value="6樓">6 樓</option>
                                <option value="7樓">7 樓</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div id="cycleSelectWrapper">
                            <label class="block text-sm font-medium text-gray-600 mb-1">繳交期數方案</label>
                            <select id="managementCycle" onchange="calculateFeeAmount()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="2">兩月繳 ($3,000)</option>
                                <option value="1">單月繳 ($1,500)</option>
                                <option value="3">季繳 ($4,500)</option>
                                <option value="6">半年繳 ($9,000)</option>
                                <option value="12">年繳 ($18,000)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">金額 (元)</label>
                            <input type="number" id="recordAmount" required min="1" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="3000">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">備註說明</label>
                        <input type="text" id="recordRemark" placeholder="例：支票付款、特定廠商、第幾季費用等" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition duration-200">
                        📥 儲存此筆紀錄
                    </button>
                </form>
            </div>
        </div>

        <!-- 右側：圓餅圖統計分析與資料導出 -->
        <div class="space-y-6">
            <!-- 圓餅圖統計 -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex flex-col items-center">
                <h2 class="text-md font-bold text-gray-700 mb-4 w-full text-left">📊 年度收支結構比例</h2>
