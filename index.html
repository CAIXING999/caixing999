<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摘星樓收支管理</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #f8f9fa;
            --accent-color: #2980b9;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        h1.main-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .title-divider {
            height: 4px;
            width: 80px;
            background-color: var(--secondary-color);
            border-radius: 2px;
            margin-bottom: 25px;
        }

        /* 🛠️ 優化：改用 flex-direction: column 讓金額強制排到下一行 */
        .balance-banner {
            background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%);
            color: white;
            padding: 22px 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
            gap: 12px; 
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.15);
        }
        .balance-label {
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }
        .balance-label span {
            background-color: var(--secondary-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 5px;
            font-size: 14px;
        }
        /* 調整金額字體，與標題完美錯開 */
        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 700;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }
        input, select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            background-color: #fff;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 5px rgba(41, 128, 185, 0.3);
        }
        input:disabled, select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #7f8c8d;
        }
        .hidden-group {
            display: none;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 13px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.3s;
            width: 100%;
            box-shadow: 0 2px 5px rgba(24, 188, 156, 0.2);
        }
        button:hover {
            background-color: #128f76;
        }
        .table-container {
            margin-top: 35px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 700;
        }
        tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title">摘星樓收支管理</h1>
    <div class="title-divider"></div>
    
    <!-- 年度結餘顯示列 -->
    <div class="balance-banner">
        <div class="balance-label">
            <span id="rocYearLabel">民國 -- 年</span>年度當前結餘
        </div>
        <div class="balance-amount" id="currentBalanceDisplay">
            NT$ 120,662.00
        </div>
    </div>
    
    <!-- 記帳表單 -->
    <div class="form-grid">
        <div class="form-group">
            <label for="txDate">交易日期</label>
            <input type="date" id="txDate">
        </div>

        <div class="form-group">
            <label for="txType">收支類型</label>
            <select id="txType" onchange="updateCategories(); handleLogicChange();">
                <option value="收入" selected>收入</option>
                <option value="支出">支出</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mainCategory">主要科目</label>
            <select id="mainCategory">
                <!-- JS 動態插入 -->
            </select>
        </div>

        <div class="form-group">
            <label for="floor">對應樓層</label>
            <select id="floor">
                <option value="">-- 請選擇樓層 --</option>
                <option value="2F">2 樓</option>
                <option value="3F">3 樓</option>
                <option value="4F">4 樓</option>
                <option value="5F">5 樓</option>
                <option value="6F">6 樓</option>
                <option value="7F">7 樓</option>
            </select>
        </div>

        <div class="form-group hidden-group" id="planGroup">
            <label for="paymentPlan">繳交期數方案</label>
            <select id="paymentPlan" onchange="handlePlanPrice()">
                <option value="" data-price="0">-- 請選擇方案 --</option>
                <option value="雙月繳" data-price="3000">雙月繳 ($3,000)</option>
                <option value="半年繳" data-price="9000">半年繳 ($9,000)</option>
                <option value="年繳" data-price="18000">年繳 ($18,000)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">金額</label>
            <input type="number" id="amount" placeholder="請輸入金額" min="0">
        </div>
    </div>

    <button onclick="addRecord()">➕ 新增收支紀錄</button>

    <div class="table-container">
        <h3 style="color: var(--primary-color);">📊 歷史收支明細</h3>
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>類型</th>
                    <th>科目</th>
                    <th>樓層</th>
                    <th>配置方案</th>
                    <th>金額</th>
                </tr>
            </thead>
            <tbody id="recordTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentBalance = 120662.00;
    const incomeCategories = ["管理費", "其他"];
    const expenseCategories = ["電梯保養費", "清潔費", "公設電費", "電梯代辦檢驗及證照費", "消防申報費", "其他"];

    window.onload = function() {
        const todayObj = new Date();
        const yyyy = todayObj.getFullYear();
        const mm = String(todayObj.getMonth() + 1).padStart(2, '0');
        const dd = String(todayObj.getDate()).padStart(2, '0');
        document.getElementById('txDate').value = `${yyyy}-${mm}-${dd}`;

        // 🛠️ 修正：補齊閉合括號，確保民國年份能正確初始化與渲染
        const rocYear = yyyy - 1911;
        document.getElementById('rocYearLabel').textContent = `民國 ${rocYear} 年`;

        // 監聽日期變化，即時同步更新民國年標籤
        document.getElementById('txDate').addEventListener('change', function() {
            const dateVal = this.value;
            if (dateVal) {
                const year = parseInt(dateVal.split('-'), 10);
                document.getElementById('rocYearLabel').textContent = `民國 ${year - 1911} 年`;
            }
        });

        // 監聽主要科目變更
        document.getElementById('mainCategory').addEventListener('change', handleLogicChange);

        // 正確的初始化順序
        updateCategories();     
        handleLogicChange();    
        updateBalanceDisplay(); 
    };

    function updateBalanceDisplay() {
        document.getElementById('currentBalanceDisplay').textContent = 
            `NT$ ${currentBalance.toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function updateCategories() {
        const txType = document.getElementById('txType').value;
        const mainCategorySelect = document.getElementById('mainCategory');
        mainCategorySelect.innerHTML = '';

        const categories = txType === '收入' ? incomeCategories : expenseCategories;
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            mainCategorySelect.appendChild(opt);
        });
    }

    function handleLogicChange() {
        const txType = document.getElementById('txType').value;
        const mainCategory = document.getElementById('mainCategory').value;
        const planGroup = document.getElementById('planGroup');
        const paymentPlan = document.getElementById('paymentPlan');
        const amountInput = document.getElementById('amount');

        if (txType === '收入' && mainCategory === '管理費') {
            planGroup.classList.remove('hidden-group');
            amountInput.disabled = true; 
            handlePlanPrice(); 
        } else {
            planGroup.classList.add('hidden-group');
            paymentPlan.value = '';
